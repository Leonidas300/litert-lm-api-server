services:
  gemma-api:
    build: .
    container_name: gemma-api
    restart: unless-stopped
    ports:
      - "3008:3000"
    volumes:
      - /opt/models/gemma-4-E2B-it.litertlm:/models/gemma-4-E2B-it.litertlm:ro
    environment:
      MODEL_PATH: /models/gemma-4-E2B-it.litertlm
      API_KEY: sk-local
      BACKEND: cpu
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 6G
